{% extends "videos/base.html" %}
{% block title %}Premium Required{% endblock %}

{% block content %}

<style>
.locked-wrapper {
    min-height: 85vh;
    background: #0f0f0f;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
}

.locked-container {
    width: 850px;
    background: #181818;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    border: 1px solid #222;
}

/* Thumbnail preview */
.thumbnail-preview {
    position: relative;
    height: 320px;
    overflow: hidden;
}

.thumbnail-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(6px) brightness(0.6);
}

/* Lock overlay */
.lock-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
}

.lock-icon {
    font-size: 60px;
    margin-bottom: 15px;
}

.lock-overlay h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 500;
}

.lock-overlay p {
    margin-top: 8px;
    color: #ccc;
    font-size: 14px;
}

/* Bottom content */
.locked-content {
    padding: 30px 40px;
}

.video-title {
    font-size: 18px;
    margin-bottom: 10px;
}

.upgrade-btn {
    margin-top: 20px;
    padding: 10px 22px;
    border-radius: 20px;
    border: none;
    background: #ff0000;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.upgrade-btn:hover {
    background: #cc0000;
    transform: scale(1.04);
}

.secondary-link {
    display: inline-block;
    margin-left: 15px;
    color: #aaa;
    font-size: 13px;
    text-decoration: none;
}

.secondary-link:hover {
    color: white;
}
</style>

<div class="locked-wrapper">

    <div class="locked-container">

        <!-- Blurred Thumbnail Section -->
        <div class="thumbnail-preview">
            <img src="{{ video.thumbnail.url }}">

            <div class="lock-overlay">
                <div class="lock-icon">🔒</div>
                <h2>Premium content</h2>
                <p>This video is available to Premium members only</p>
            </div>
        </div>

        <!-- Info Section -->
        <div class="locked-content">

            <div class="video-title">
                {{ video.title }}
            </div>

            <a href="{% url 'subscription_plans' %}">
                <button class="upgrade-btn">
                    Join Premium
                </button>
            </a>

            <a href="{% url 'home' %}" class="secondary-link">
                Back to Home
            </a>

        </div>

    </div>

</div>

{% endblock %}
