{% extends "videos/base.html" %}
{% block title %}Edit Playlist{% endblock %}
{% block content %}

<style>
* {
    font-family: Roboto, Arial, sans-serif;
    box-sizing: border-box;
}

.edit-wrapper {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.edit-card {
    width: 100%;
    max-width: 560px;
    background: #181818;
    padding: 32px;
    border-radius: 14px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.6);
    color: white;
}

/* ✅ Header with close button */
.edit-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
}

.edit-header h2 {
    font-weight: 500;
    font-size: 22px;
    margin: 0;
}

.close-btn {
    background: #2a2a2a;
    border: none;
    color: #aaa;
    font-size: 20px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    line-height: 1;
}

.close-btn:hover {
    background: #333;
    color: white;
}

.field-group {
    margin-bottom: 20px;
}

.field-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 500;
    color: #ddd;
}

.edit-card input[type="text"] {
    width: 100%;
    padding: 12px;
    background: #0f0f0f;
    color: white;
    border: 1px solid #303030;
    border-radius: 8px;
    font-size: 14px;
    font-family: Roboto, Arial, sans-serif;
    transition: border-color 0.2s;
}

.edit-card input[type="text"]:focus {
    border-color: #ff0000;
    outline: none;
}

/* ✅ Checkbox row */
.checkbox-row {
    display: flex !important;
    align-items: center !important;
    gap: 10px;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    font-family: Roboto, Arial, sans-serif;
    line-height: 1;
}


.checkbox-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: #ff0000;
    cursor: pointer;
    flex-shrink: 0;
    margin: 0;
    padding: 0;
}

.checkbox-row span {
    line-height: 1;
    vertical-align: middle;
}

.field-group small {
    display: block;
    margin-left: 26px;
    margin-top: 5px;
    font-size: 12px;
    color: #aaa;
    line-height: 1.4;
}

/* ✅ Upload video section */
.upload-section {
    background: #0f0f0f;
    border: 1px dashed #303030;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
    text-align: center;
}

.upload-section p {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 10px;
}

.upload-video-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    background: #2a2a2a;
    color: white;
    border-radius: 20px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.2s;
}

.upload-video-btn:hover {
    background: #3a3a3a;
}

/* ✅ Buttons matching other forms */
.form-actions {
    margin-top: 28px;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
}

.action-btn {
    padding: 10px 26px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    font-family: Roboto, Arial, sans-serif;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    transition: background 0.2s;
}

.save-btn {
    background: #ff0000;
    color: white;
}

.save-btn:hover {
    background: #e60000;
}

.cancel-btn {
    background: #2a2a2a;
    color: #ddd;
}

.cancel-btn:hover {
    background: #333;
    color: white;
}
.playlist-videos {
    background: #0f0f0f;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 20px;
}

.videos-label {
    font-size: 13px;
    color: #aaa;
    margin: 0 0 12px 0;
}

.video-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid #1f1f1f;
}

.video-row:last-child {
    border-bottom: none;
}

.video-thumb {
    width: 80px;
    height: 45px;
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
    background: #1f1f1f;
}

.video-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.thumb-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
    font-size: 16px;
}

.video-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.video-name {
    font-size: 13px;
    font-weight: 500;
    color: white;
}

.video-meta {
    font-size: 12px;
    color: #aaa;
}

.remove-btn {
    color: #aaa;
    font-size: 14px;
    text-decoration: none;
    padding: 4px 8px;
    border-radius: 50%;
    transition: background 0.2s;
    flex-shrink: 0;
}

.remove-btn:hover {
    background: #2a2a2a;
    color: white;
}
</style>

<div class="edit-wrapper">
    <div class="edit-card">

        <!-- ✅ Header -->
        <div class="edit-header">
            <h2>✏️ Edit Playlist</h2>
            <a href="{% url 'playlist_list' %}" class="close-btn" title="Cancel">✕</a>
        </div>

        <form method="post">
            {% csrf_token %}

            <!-- Playlist Name -->
            <div class="field-group">
                <label>Playlist Name</label>
                {{ form.name }}
            </div>

            <!-- Public checkbox -->
            <div class="field-group">
                <label class="checkbox-row">
                    <input type="checkbox"
                        name="{{ form.is_public.html_name }}"
                        id="{{ form.is_public.id_for_label }}"
                        {% if form.is_public.value %}checked{% endif %}>
                    <span>Make Playlist Public</span>
                </label>
                <small>Public playlists are visible to everyone</small>
            </div>

            <!-- Actions -->
            <div class="form-actions">
                <a href="{% url 'playlist_list' %}" class="action-btn cancel-btn">Cancel</a>
                <button type="submit" class="action-btn save-btn">Save</button>
            </div>

        </form>
    </div>
</div>

{% endblock %}
