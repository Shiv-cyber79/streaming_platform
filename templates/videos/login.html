<h2>Playlists</h2>

<div class="playlist-grid">
    {% for playlist in playlists %}
        <div class="playlist-card">
            <h3>{{ playlist.name }}</h3>

            {% for video in playlist.videos.all %}
                <p>
                    <a href="{% url 'video_detail' video.id %}">
                        ▶ {{ video.title }}
                    </a>
                </p>
            {% endfor %}

        </div>
    {% endfor %}
</div>
