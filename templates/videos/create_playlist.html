{% extends "videos/base.html" %}
{% block title %}Create Playlist{% endblock %}
{% block content %}

<style>
* {
    font-family: Roboto, Arial, sans-serif;
    box-sizing: border-box;
}

.create-container {
    max-width: 560px;
    margin: 40px auto;
    background: #181818;
    padding: 32px;
    border-radius: 14px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.6);
    color: white;
}

.create-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
}

.create-header h2 {
    font-weight: 500;
    font-size: 22px;
    margin: 0;
}

.close-btn {
    background: #2a2a2a;
    border: none;
    color: #aaa;
    font-size: 20px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    line-height: 1;
}

.close-btn:hover {
    background: #333;
    color: white;
}

.field-group {
    margin-bottom: 20px;
}

.field-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 500;
    color: #ddd;
}

/* ✅ Match upload form input style */
.create-container input[type="text"],
.create-container input[type="file"] {
    width: 100%;
    padding: 12px;
    background: #0f0f0f;
    color: white;
    border: 1px solid #303030;
    border-radius: 8px;
    font-size: 14px;
    font-family: Roboto, Arial, sans-serif;
    transition: border-color 0.2s;
}

.create-container input[type="text"]:focus,
.create-container input[type="file"]:focus {
    border-color: #ff0000;
    outline: none;
}

.create-container input::file-selector-button {
    background: #303030;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 12px;
    font-family: Roboto, Arial, sans-serif;
    font-size: 13px;
}

.create-container input::file-selector-button:hover {
    background: #444;
}

/* ✅ Checkbox row matching upload form */
.checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    line-height: 1;
}

.checkbox-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: #ff0000;
    cursor: pointer;
    flex-shrink: 0;
    margin: 0;
}

/* ✅ Buttons matching upload form */
.form-actions {
    margin-top: 28px;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
}

.action-btn {
    padding: 10px 26px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    font-family: Roboto, Arial, sans-serif;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    transition: background 0.2s;
}

.submit-btn {
    background: #ff0000;
    color: white;
}

.submit-btn:hover {
    background: #e60000;
}

.cancel-btn {
    background: #2a2a2a;
    color: #ddd;
}

.cancel-btn:hover {
    background: #333;
    color: white;
}
</style>

<div class="create-container">

    <div class="create-header">
        <h2>🎬 Create New Playlist</h2>
        <a href="{% url 'playlist_list' %}" class="close-btn" title="Cancel">✕</a>
    </div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="field-group">
            <label>Playlist Name</label>
            {{ form.playlist_name }}
        </div>

        <div class="field-group">
            <label>Upload Thumbnail</label>
            {{ form.thumbnail }}
        </div>

        <div class="field-group">
            <label>Video Title</label>
            {{ form.video_title }}
        </div>

        <div class="field-group">
            <label>Upload Video</label>
            {{ form.video_file }}
        </div>

        <!-- ✅ Checkbox matching upload form style -->
        <div class="field-group">
            <label class="checkbox-row">
                
                <span>Make Playlist Public</span><input type="checkbox"
                       name="{{ form.is_public.html_name }}"
                       id="{{ form.is_public.id_for_label }}"
                       {% if form.is_public.value %}checked{% endif %}>
            </label>
        </div>

        <div class="form-actions">
            <a href="{% url 'playlist_list' %}" class="action-btn cancel-btn">Cancel</a>
            <button type="submit" class="action-btn submit-btn">Create Playlist</button>
        </div>

    </form>
</div>

{% endblock %}
