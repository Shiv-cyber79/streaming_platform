{% extends "videos/base.html" %}

{% block content %}

<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700&display=swap');

  :root {
    --red:    #e81c1c;
    --red2:   #ff3a3a;
    --bg:     #080808;
    --panel:  #0f0f0f;
    --border: #1c1c1c;
    --muted:  #3a3a3a;
    --text:   #e8e8e8;
    --sub:    #555;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    overflow: hidden;
  }

  #live-wrap {
    display: flex;
    width: 100vw;
    height: 100vh;
  }

  /* VIDEO SIDE */
  #video-side {
    flex: 1;
    position: relative;
    background: #000;
    overflow: hidden;
    min-width: 0;
  }

  #remoteVideo {
    position: absolute;
    inset: 0; width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    z-index: 1;
  }

  #offline-screen {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #000;
    transition: opacity 0.5s ease;
  }
  #offline-screen.hidden { opacity: 0; pointer-events: none; }

  .orbit { position: relative; width: 120px; height: 120px; margin-bottom: 22px; }
  .orbit-ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 1.5px solid var(--red);
    opacity: 0;
    animation: orbit-pulse 2.4s ease-out infinite;
  }
  .orbit-ring:nth-child(2) { animation-delay: 0.8s; }
  .orbit-ring:nth-child(3) { animation-delay: 1.6s; }
  @keyframes orbit-pulse {
    0%   { transform: scale(0.3); opacity: 0.75; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  .orbit-core {
    position: absolute; inset: 35px; border-radius: 50%;
    background: radial-gradient(circle, #1e0000 0%, #000 100%);
    border: 1.5px solid #2a0000;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .offline-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px; letter-spacing: 5px;
    color: var(--muted); text-transform: uppercase;
  }
  .offline-sub { font-size: 11px; color: #2a2a2a; margin-top: 6px; letter-spacing: 1px; }

  #hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  .hud-pill {
    position: absolute;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 13px; border-radius: 100px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.8px;
    text-transform: uppercase;
    backdrop-filter: blur(12px);
  }
  #badge-live {
    top: 18px; left: 18px;
    background: rgba(232,28,28,0.92); color: #fff;
    box-shadow: 0 0 22px rgba(232,28,28,0.45);
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #fff; animation: blink 1.1s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.1;} }
  #badge-viewers {
    top: 18px; right: 18px;
    background: rgba(0,0,0,0.65);
    border: 1px solid rgba(255,255,255,0.1); color: var(--text);
  }
  #badge-status {
    top: 54px; right: 18px;
    background: rgba(0,0,0,0.65);
    border: 1px solid rgba(255,255,255,0.1); color: var(--text);
    transition: all 0.4s;
  }
  #badge-status.is-offline { border-color: rgba(232,28,28,0.35); color: #ff6666; }

  #rec-indicator {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    z-index: 12; display: none; align-items: center; gap: 7px;
    background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 100px; padding: 5px 14px;
    font-size: 11px; letter-spacing: 0.8px; color: #ccc;
    backdrop-filter: blur(10px); pointer-events: none;
  }
  #rec-indicator .rec-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--red); animation: blink 0.9s ease-in-out infinite;
  }

  #localVideo {
    position: absolute; bottom: 88px; right: 18px;
    width: 200px; height: 120px; border-radius: 10px;
    object-fit: cover; background: #111;
    border: 2px solid rgba(255,255,255,0.2);
    box-shadow: 0 10px 40px rgba(0,0,0,0.65);
    z-index: 12; display: none;
  }

  #controls-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    z-index: 15; pointer-events: auto;
    padding: 0 24px 22px;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
    display: flex; align-items: center; gap: 10px; min-height: 80px;
  }
  .stream-btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 11px 26px; border: none; border-radius: 8px;
    font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 1.5px;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
  }
  .stream-btn:hover  { transform: translateY(-2px); }
  .stream-btn:active { transform: scale(0.97); }
  #btn-golive {
    background: var(--red); color: #fff;
    box-shadow: 0 4px 22px rgba(232,28,28,0.5);
  }
  #btn-golive:hover { background: var(--red2); }
  #btn-stop {
    background: rgba(255,255,255,0.1); color: #fff;
    border: 1px solid rgba(255,255,255,0.18); display: none;
  }
  #btn-stop:hover { background: rgba(255,255,255,0.18); }

  /* CHAT */
  #chat-side {
    width: 330px; min-width: 330px; height: 100%;
    background: var(--panel); border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #chat-header {
    height: 56px; padding: 0 18px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  #chat-header .ch-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 20px;
    letter-spacing: 2px; color: var(--text);
  }
  #chat-header .ch-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--red); margin-left: auto;
    animation: blink 1.1s ease-in-out infinite;
  }
  #chatBox {
    flex: 1; overflow-y: auto;
    padding: 12px 12px 6px;
    display: flex; flex-direction: column; gap: 6px;
    scroll-behavior: smooth;
  }
  #chatBox::-webkit-scrollbar { width: 3px; }
  #chatBox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .chat-bubble {
    background: #161616; border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px;
    font-size: 13px; line-height: 1.55; word-break: break-word;
    animation: bubble-in 0.22s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes bubble-in {
    from { opacity:0; transform: translateY(8px) scale(0.97); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }
  .bubble-user {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--red); margin-bottom: 3px;
  }
  .bubble-text { color: #c8c8c8; }
  .chat-bubble.mine { background: #1a0808; border-color: #2d1010; }
  .chat-bubble.mine .bubble-user { color: #ff7070; }
  .chat-system {
    text-align: center; font-size: 10px; color: var(--sub);
    letter-spacing: 0.8px; text-transform: uppercase; padding: 2px 0;
  }
  #chat-footer {
    border-top: 1px solid var(--border);
    padding: 12px; display: flex; gap: 8px; flex-shrink: 0;
  }
  #chatInput {
    flex: 1; background: #161616; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px;
    color: var(--text); font-family: 'Syne', sans-serif; font-size: 13px;
    outline: none; transition: border-color 0.2s;
  }
  #chatInput::placeholder { color: var(--muted); }
  #chatInput:focus { border-color: var(--red); }
  #sendBtn {
    width: 42px; height: 42px; background: var(--red); border: none;
    border-radius: 8px; color: #fff; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background 0.2s, transform 0.15s;
  }
  #sendBtn:hover  { background: var(--red2); transform: scale(1.06); }
  #sendBtn:active { transform: scale(0.95); }

  #toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: rgba(14,14,14,0.96); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 24px;
    font-size: 13px; color: var(--text);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 9999; backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6); white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<div id="live-wrap">

  <div id="video-side">
    <video id="remoteVideo" autoplay playsinline muted></video>

    <div id="offline-screen">
      <div class="orbit">
        <div class="orbit-ring"></div>
        <div class="orbit-ring"></div>
        <div class="orbit-ring"></div>
        <div class="orbit-core">📡</div>
      </div>
      <div class="offline-label">Waiting for Stream</div>
      <div class="offline-sub">Stream will begin shortly…</div>
    </div>

    <div id="hud">
      <div class="hud-pill" id="badge-live"><span class="live-dot"></span> LIVE</div>
      <div class="hud-pill" id="badge-viewers">👀 <span id="viewer-num">0</span> watching</div>
      <div class="hud-pill" id="badge-status">🟢 Online</div>
    </div>

    <div id="rec-indicator"><span class="rec-dot"></span> REC</div>

    <!-- Click to play button (shown if autoplay is blocked) -->
    <div id="play-btn-overlay" style="
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.5);
      cursor: pointer;
     "onclick="manualPlay()">
     <div style="
       width: 80px; height: 80px;
       border-radius: 50%;
       background: rgba(232,28,28,0.9);
       display: flex; align-items: center; justify-content: center;
       font-size: 32px;
       box-shadow: 0 0 30px rgba(232,28,28,0.5);
    ">▶</div>
  </div>

    {% if is_broadcaster %}
    <video id="localVideo" autoplay playsinline muted></video>
    {% endif %}

    <div id="controls-bar">
      {% if is_broadcaster %}
      <button class="stream-btn" id="btn-golive" onclick="startStreaming()">🔴 Go Live</button>
      <button class="stream-btn" id="btn-stop"   onclick="stopStreaming()">⏹ End Stream</button>
      {% endif %}
    </div>
  </div>

  <div id="chat-side">
    <div id="chat-header">
      <span class="ch-title">💬 Live Chat</span>
      <span class="ch-dot"></span>
    </div>
    <div id="chatBox"></div>
    <div id="chat-footer">
      <input 
        id="chatInput"
        placeholder="Type message..."
        autocomplete="off"
      >
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

</div>

<div id="toast"></div>

{% endblock %}


{% block script %}
<script>
// ═══════════════════════════════════════
// GLOBALS
// ═══════════════════════════════════════
var IS_BROADCASTER = "{{ is_broadcaster|yesno:'true,false' }}" === "true";
var ROOM_NAME      = "{{ room_name }}";
var CURRENT_USER   = "{{ request.user.username|default:'Guest' }}";

var ICE_CONFIG = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302"    },
    { urls: "stun:stun1.l.google.com:19302"   },
    { urls: "stun:stun2.l.google.com:19302"   },
    { urls: "stun:stun3.l.google.com:19302"   },
    { urls: "stun:stun4.l.google.com:19302"   },
    { urls: "stun:stun.stunprotocol.org:3478" },
  ]
};

var localStream    = null;
var peers          = {};
var mediaRecorder  = null;
var recordedChunks = [];
var socketReady    = false;
var isStreaming    = false;
var toastTimer     = null;
var socket         = null;

function showPlayButton() {
  var overlay = document.getElementById("play-btn-overlay");
  if (overlay) overlay.style.display = "flex";
}

function manualPlay() {
  if (!elRemoteVideo) return;

  elRemoteVideo.muted = false;

  elRemoteVideo.play().then(function() {
    console.log("▶️ Manual play success");
    var overlay = document.getElementById("play-btn-overlay");
    if (overlay) overlay.style.display = "none";
  }).catch(function(err) {
    console.error("❌ Manual play failed:", err);
  });
}

var elChatBox, elViewerNum, elBadgeStatus, elOfflineScreen,
    elRemoteVideo, elRecIndicator, elBtnGolive, elBtnStop,
    elLocalVideo, elToast, elChatInput;

// ═══════════════════════════════════════
// BOOT — runs after full page load
// ═══════════════════════════════════════
window.onload = function() {
  elChatBox       = document.getElementById("chatBox");
  elViewerNum     = document.getElementById("viewer-num");
  elBadgeStatus   = document.getElementById("badge-status");
  elOfflineScreen = document.getElementById("offline-screen");
  elRemoteVideo   = document.getElementById("remoteVideo");
  elRecIndicator  = document.getElementById("rec-indicator");
  elBtnGolive     = document.getElementById("btn-golive");
  elBtnStop       = document.getElementById("btn-stop");
  elLocalVideo    = document.getElementById("localVideo");
  elToast         = document.getElementById("toast");
  elChatInput     = document.getElementById("chatInput");

  console.log("✅ DOM ready | broadcaster:", IS_BROADCASTER, "| room:", ROOM_NAME);
  console.log("remoteVideo:", elRemoteVideo);
  console.log("chatBox:", elChatBox);

  initWebSocket();
};

// ═══════════════════════════════════════
// WEBSOCKET
// ═══════════════════════════════════════
function initWebSocket() {
  var proto = window.location.protocol === "https:" ? "wss" : "ws";
  var url   = proto + "://" + window.location.host + "/ws/live/" + ROOM_NAME + "/";
  console.log("🔌 Connecting to:", url);

  socket = new WebSocket(url);

  socket.onopen = function() {
    console.log("✅ WebSocket connected");
    socketReady = true;

    // Viewer announces itself so broadcaster can send an offer
    if (!IS_BROADCASTER) {
      setTimeout(function() {
        wsSend({ type: "viewer_ready" });
        console.log("📡 viewer_ready sent");
      }, 500);
    }
  };

  socket.onclose = function(e) {
    console.warn("🔌 WebSocket closed:", e.code);
    socketReady = false;
    toast("Connection lost — please refresh.", 5000);
    setStatus("offline");
  };

  socket.onerror = function(e) {
    console.error("❌ WS error", e);
  };

  socket.onmessage = async function(event) {
    var data;
    try   { data = JSON.parse(event.data); }
    catch { return; }

    console.log("📩 MSG:", JSON.stringify(data).slice(0, 120));

    // Viewer count
    if (data.viewers !== undefined) {
      if (elViewerNum) elViewerNum.textContent = data.viewers;
      return;
    }

    // User joined / left
    if (data.type === "status") {
      setStatus(data.status);
      var label = (data.user || "").split("_").pop().slice(0, 8);
      if (data.status === "online") {
        addSystemMsg(label + " joined");
        if (IS_BROADCASTER && isStreaming && localStream) {
          console.log("📡 New viewer joined while live, creating peer...");
          setTimeout(function() { createPeer(data.user); }, 500);
        }
      } else {
        addSystemMsg(label + " left");
        if (peers[data.user]) {
          peers[data.user].close();
          delete peers[data.user];
        }
      }
      return;
    }

    // Viewer ready → broadcaster sends offer
    if (data.type === "viewer_ready" && IS_BROADCASTER) {
      console.log("📡 viewer_ready received from:", data.sender_channel_name);
      if (isStreaming && localStream) {
        setTimeout(function() { createPeer(data.sender_channel_name); }, 200);
      } else {
        console.log("ℹ️ Broadcaster not live yet, ignoring viewer_ready");
      }
      return;
    }

    // Stream started → viewer sends viewer_ready to get offer
    if (data.type === "stream_started" && !IS_BROADCASTER) {
      console.log("🎬 stream_started received, sending viewer_ready...");
      wsSend({ type: "viewer_ready" });
      return;
    }

    // Chat
    if (data.chat !== undefined) {
      console.log("💬 CHAT RECEIVED:", data);

      addChatMsg(
        data.sender || "User",
        data.chat,
        data.sender === CURRENT_USER
      );

     return;
    }

    // Viewer receives offer
    if (data.offer && !IS_BROADCASTER) {
      console.log("📨 Offer received from broadcaster");
      await handleOffer(data.offer, data.sender_channel_name);
      return;
    }

    // Broadcaster receives answer
    if (data.answer && IS_BROADCASTER) {
     console.log("📨 Answer received from viewer:", data.sender_channel_name);

     var pc = peers[data.sender_channel_name];

     if (pc) {
    // ✅ Prevent duplicate answer
       if (pc.signalingState === "have-local-offer") {
        try {
          await pc.setRemoteDescription(
            new RTCSessionDescription(data.answer)
          );
          console.log("✅ Remote answer set successfully");
       }   catch (e) {
        console.error("❌ setRemoteDescription error:", e);
      }
    } else {
       console.warn("⚠️ Ignoring duplicate answer. Current state:", pc.signalingState);
    }
  }

  return;
}

    // ICE candidate
    if (data.candidate) {
      var pc = peers[data.sender_channel_name];
      if (pc) {
        try {
          if (pc.remoteDescription) {
            await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
          }
        } catch(e) { /* benign */ }
      }
      return;
    }
  };
}

function wsSend(obj) {
  if (socket && socketReady && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify(obj));
  } else {
    console.warn("⚠️ wsSend failed — socket not ready");
  }
}

// ═══════════════════════════════════════
// VIEWER — HANDLE OFFER
// ═══════════════════════════════════════
async function handleOffer(offer, senderChannel) {
  console.log("🔧 handleOffer:", senderChannel);
  if (peers[senderChannel]) {
    peers[senderChannel].close();
    delete peers[senderChannel];
  }

  var pc = new RTCPeerConnection(ICE_CONFIG);
  peers[senderChannel] = pc;

  pc.ontrack = function(e) {
    console.log("🎥 ontrack fired! streams:", e.streams.length, "tracks:", e.track.kind);
    if (e.streams && e.streams[0]) {
      elRemoteVideo.srcObject = e.streams[0];
      elRemoteVideo.muted = true;

      elRemoteVideo.play().then(function() {
        console.log("✅ Video playing on viewer!");
        if (elOfflineScreen) elOfflineScreen.classList.add("hidden");
      }).catch(function(err) {
        console.warn("⚠️ Autoplay blocked:", err);
        // Show a click-to-play button

        showPlayButton();
      });
    }
  };

  pc.onicecandidate = function(e) {
    if (e.candidate) {
      wsSend({ candidate: e.candidate, target: senderChannel });
    }
  };

  pc.onconnectionstatechange = function() {
    console.log("🔗 Viewer peer state:", pc.connectionState);
    if (pc.connectionState === "failed" || pc.connectionState === "closed") {
      elRemoteVideo.srcObject = null;
      if (elOfflineScreen) elOfflineScreen.classList.remove("hidden");
      delete peers[senderChannel];
    }
  };

  try {
    await pc.setRemoteDescription(new RTCSessionDescription(offer));
    console.log("✅ setRemoteDescription done");
    var answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    console.log("✅ setLocalDescription done, sending answer...");
    wsSend({ answer: answer, target: senderChannel });
  } catch(e) {
    console.error("❌ handleOffer error:", e);
  }
}

// ═══════════════════════════════════════
// BROADCASTER — GO LIVE
// ═══════════════════════════════════════
window.startStreaming = async function() {
  if (!IS_BROADCASTER || isStreaming) return;
  console.log("🎬 startStreaming called");

  var waited = 0;
  while (!socketReady && waited < 8000) {
    await new Promise(function(r) { setTimeout(r, 150); });
    waited += 150;
  }
  if (!socketReady) { toast("⚠️ Not connected. Please refresh."); return; }

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    console.log("✅ Got camera stream:", localStream.getTracks().map(function(t){return t.kind;}));
  } catch(err) {
    console.error("❌ getUserMedia error:", err);
    toast("❌ Camera/Mic permission denied.");
    return;
  }

  if (elLocalVideo)    { elLocalVideo.srcObject = localStream; elLocalVideo.style.display = "block"; }
  if (elRemoteVideo)   elRemoteVideo.srcObject = localStream;
  if (elOfflineScreen) elOfflineScreen.classList.add("hidden");

  // Start recording
  var mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
    ? "video/webm;codecs=vp9,opus" : "video/webm";
  try   { mediaRecorder = new MediaRecorder(localStream, { mimeType: mimeType }); }
  catch { mediaRecorder = new MediaRecorder(localStream); }

  recordedChunks = [];
  mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.start(1000);

  isStreaming = true;
  if (elBtnGolive)    elBtnGolive.style.display    = "none";
  if (elBtnStop)      elBtnStop.style.display       = "inline-flex";
  if (elRecIndicator) elRecIndicator.style.display  = "flex";

  toast("🔴 You are now LIVE!");
  addSystemMsg("Stream started");

  // Tell all viewers that stream has started
  wsSend({ type: "stream_started" });
  console.log("📡 stream_started broadcasted");
};

// ═══════════════════════════════════════
// BROADCASTER — CREATE PEER PER VIEWER
// ═══════════════════════════════════════
async function createPeer(viewerChannel) {
  if (!localStream) {
    console.warn("❌ createPeer: no localStream");
    return;
  }
  if (!viewerChannel) {
    console.warn("❌ createPeer: no viewerChannel");
    return;
  }

  if (peers[viewerChannel]) {
    var s = peers[viewerChannel].connectionState;
    if (s === "connected" || s === "connecting") {
      console.log("ℹ️ Peer already exists:", s);
      return;
    }
    peers[viewerChannel].close();
    delete peers[viewerChannel];
  }

  console.log("🔗 createPeer for:", viewerChannel.slice(-10));
  var pc = new RTCPeerConnection(ICE_CONFIG);
  peers[viewerChannel] = pc;

  localStream.getTracks().forEach(function(track) {
    pc.addTrack(track, localStream);
    console.log("➕ addTrack:", track.kind);
  });

  pc.onicecandidate = function(e) {
    if (e.candidate) {
      wsSend({ candidate: e.candidate, target: viewerChannel });
    }
  };

  pc.onconnectionstatechange = function() {
    console.log("🔗 Broadcaster peer state:", pc.connectionState);
    if (pc.connectionState === "failed" || pc.connectionState === "closed") {
      delete peers[viewerChannel];
    }
  };

  try {
    var offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    wsSend({ offer: offer, target: viewerChannel });
    console.log("📤 Offer sent to:", viewerChannel.slice(-10));
  } catch(e) {
    console.error("❌ createPeer error:", e);
  }
}

// ═══════════════════════════════════════
// BROADCASTER — STOP
// ═══════════════════════════════════════
wsSend({ type: "stream_ended" });
window.stopStreaming = function() {
  if (!isStreaming) return;
  wsSend({ type: "stream_ended" });
  console.log("⏹ stopStreaming called");

  toast("⏹ Ending stream…");
  addSystemMsg("Stream ended");

  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
    mediaRecorder.onstop = function() {
      var blob = new Blob(recordedChunks, { type: "video/webm" });
      saveRecording(blob);
    };
  }

  Object.values(peers).forEach(function(pc) { pc.close(); });
  peers = {};

  if (localStream) {
    localStream.getTracks().forEach(function(t) { t.stop(); });
    localStream = null;
  }

  if (elRemoteVideo)   elRemoteVideo.srcObject = null;
  if (elLocalVideo)    { elLocalVideo.srcObject = null; elLocalVideo.style.display = "none"; }
  if (elOfflineScreen) elOfflineScreen.classList.remove("hidden");
  if (elBtnGolive)     elBtnGolive.style.display    = "inline-flex";
  if (elBtnStop)       elBtnStop.style.display       = "none";
  if (elRecIndicator)  elRecIndicator.style.display  = "none";

  isStreaming = false;
};

// ═══════════════════════════════════════
// SAVE RECORDING → SERVER
// ═══════════════════════════════════════
function saveRecording(blob) {
  var filename = "live_" + ROOM_NAME + "_" + Date.now() + ".webm";

  // Always download locally
  var blobUrl = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = blobUrl; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(blobUrl); }, 5000);

  // Get CSRF token from cookie
  var csrf = null;
  var cookies = document.cookie.split(";");
  for (var i = 0; i < cookies.length; i++) {
    var c = cookies[i].trim();
    if (c.indexOf("csrftoken=") === 0) {
      csrf = c.substring("csrftoken=".length);
      break;
    }
  }

  console.log("🍪 All cookies:", document.cookie);
  console.log("🔑 CSRF token:", csrf ? csrf.slice(0,10) + "..." : "NOT FOUND ❌");

  if (!csrf) {
    toast("📥 Saved locally — CSRF missing.", 4000);
    return;
  }

  var form = new FormData();
  form.append("video", blob, filename);
  form.append("room",  ROOM_NAME);
  form.append("title", "Live — " + new Date().toLocaleString());

  fetch("/upload-recorded/", {
    method:      "POST",
    credentials: "same-origin",
    headers:     { "X-CSRFToken": csrf },
    body:        form,
  })
  .then(function(r) {
    console.log("Upload response status:", r.status);
    return r.ok ? r.json() : Promise.reject(r.status);
  })
  .then(function(d) { console.log("✅ Uploaded:", d); toast("✅ Stream saved to channel!", 4000); })
  .catch(function(err) { console.warn("❌ Upload failed:", err); toast("📥 Saved locally.", 4000); });
}

// ═══════════════════════════════════════
// CHAT
// ═══════════════════════════════════════
window.sendMessage = function() {
  if (!elChatInput) return;

  var text = elChatInput.value.trim();
  if (!text) return;

  console.log("📤 Sending:", text);

  // ✅ SEND TO SERVER
  wsSend({
    chat: text,
    sender: CURRENT_USER
  });

  // ✅ INSTANT SHOW (THIS WAS MISSING 🔥)
  addChatMsg(CURRENT_USER, text, true);

  elChatInput.value = "";
};

function addChatMsg(sender, text, isMine) {
  if (!elChatBox) return;
  var el = document.createElement("div");
  el.className = "chat-bubble" + (isMine ? " mine" : "");
  el.innerHTML = '<div class="bubble-user">' + esc(sender) + '</div>' +
                 '<div class="bubble-text">' + esc(text) + '</div>';
  elChatBox.appendChild(el);
  elChatBox.scrollTop = elChatBox.scrollHeight;
}

function addSystemMsg(text) {
  if (!elChatBox) return;
  var el = document.createElement("div");
  el.className   = "chat-system";
  el.textContent = "— " + text + " —";
  elChatBox.appendChild(el);
  elChatBox.scrollTop = elChatBox.scrollHeight;
}

function setStatus(status) {
  if (!elBadgeStatus) return;
  if (status === "online") {
    elBadgeStatus.textContent = "🟢 Online";
    elBadgeStatus.classList.remove("is-offline");
  } else {
    elBadgeStatus.textContent = "🔴 Offline";
    elBadgeStatus.classList.add("is-offline");
  }
}

function toast(msg, duration) {
  if (!elToast) return;
  duration = duration || 3000;
  elToast.textContent = msg;
  elToast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { elToast.classList.remove("show"); }, duration);
}

function esc(s) {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
</script>
