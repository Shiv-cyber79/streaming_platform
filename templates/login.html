<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Roboto, Arial, sans-serif;
            color: white;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: #181818;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
        }

        .brand {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: red;
            margin-bottom: 10px;
        }

        .login-card h2 {
            text-align: center;
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .login-card p {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 24px;
        }

        /* Messages */
        .message {
            background: #3a0f0f;
            color: #ffb4b4;
            padding: 10px;
            margin-bottom: 16px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
        }

        /* Inputs */
        .login-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            background: #0f0f0f;
            border: 1px solid #303030;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .login-card input:focus {
            outline: none;
            border-color: #ff0000;
        }

        /* Button */
        .login-card button {
            width: 100%;
            background: #ff0000;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            margin-top: 6px;
        }

        .login-card button:hover {
            background: #e60000;
        }

        /* Links */
        .login-footer {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
        }

        .login-footer a {
            color: #3ea6ff;
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="brand">▶ Stream</div>

    <h2>Log in</h2>
    <p>to continue to Stream</p>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">Log in</button>
    </form>

    <div class="login-footer">
        <a href="/users/password-reset/">Forgot password?</a>
    </div>

</div>

</body>
</html>
