{% if messages %}
    {% for message in messages %}
        <div style="
            background:#fee2e2;
            color:#991b1b;
            padding:10px;
            margin-bottom:10px;
            border-radius:5px;
        ">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}

    <input type="text" name="username"
           placeholder="Username" required><br><br>

    <input type="password" name="password"
           placeholder="Password" required><br><br>

    <button type="submit">Login</button>
</form>

<a href="/users/password-reset/">Forgot Password?</a>
