{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Complete Your Profile</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #141E30, #243B55);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 40px;
            width: 400px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
            color: white;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .profile-pic-wrapper {
            margin-bottom: 20px;
            position: relative;
        }

        .profile-pic-wrapper img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
        }

        .upload-btn {
            margin-top: 10px;
            cursor: pointer;
            color: #00c6ff;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border: none;
            border-radius: 10px;
            outline: none;
        }

        input[type="file"] {
            display: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,114,255,0.4);
        }

        h2 {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Complete Your Profile</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="profile-pic-wrapper">
            <img id="preview" src="{{ profile_picture|default:'/static/images/default_avatar.png' }}" alt="Profile Picture">
            <label for="imageUpload" class="upload-btn">Change Photo</label>
            <input id="imageUpload" type="file" name="profile_picture" accept="image/*" onchange="previewImage(event)">
        </div>

        <input type="text" name="username" placeholder="Choose Username" required>

        <button type="submit">Save & Continue</button>
    </form>
</div>

<script>
function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function(){
        const output = document.getElementById('preview');
        output.src = reader.result;
    };
    reader.readAsDataURL(event.target.files[0]);
}
</script>

</body>
</html>
