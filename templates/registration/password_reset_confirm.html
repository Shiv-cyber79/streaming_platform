<!DOCTYPE html>
<html>
<head>
    <title>Set New Password</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Roboto, Arial, sans-serif;
            color: white;
        }

        .reset-card {
            width: 100%;
            max-width: 420px;
            background: #181818;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
        }

        .brand {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: red;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 18px;
        }

        form p {
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #0f0f0f;
            border: 1px solid #303030;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #ff0000;
        }

        button {
            width: 100%;
            background: #ff0000;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-top: 10px;
        }

        button:hover {
            background: #e60000;
        }
    </style>
</head>

<body>

<div class="reset-card">

    <div class="brand">▶ Stream</div>

    <h2>Set a new password</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Reset password</button>
    </form>

</div>

</body>
</html>
