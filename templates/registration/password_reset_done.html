<!DOCTYPE html>
<html>
<head>
    <title>Email Sent</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Roboto, Arial, sans-serif;
            color: white;
        }

        .done-card {
            width: 100%;
            max-width: 420px;
            background: #181818;
            padding: 34px;
            border-radius: 14px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
            text-align: center;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
            color: red;
            margin-bottom: 12px;
        }

        h2 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .back-link {
            display: inline-block;
            font-size: 14px;
            color: #3ea6ff;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="done-card">

    <div class="brand">▶ Stream</div>

    <h2>Check your email</h2>

    <p>
        If an account exists with the email you entered,
        you’ll receive a password reset link shortly.
    </p>

    <a href="/users/login/" class="back-link">
        Back to sign in
    </a>

</div>

</body>
</html>
